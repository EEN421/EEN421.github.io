{% if site.post_search %}

<div id="beautifuljekyll-search-overlay">

  <div id="nav-search-exit" title="Exit search">✕</div>
  <input type="text" id="nav-search-input" placeholder="Search">
  <ul id="search-results-container"></ul>

  <script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
  <script>
    var searchjson = [
    {%- assign first_entry = true -%}
    {%- for post in site.posts -%}
      {%- unless first_entry -%},{%- endunless -%}
      {%- assign first_entry = false -%}
      {
        "title"    : {{ post.title | default: "" | strip_html | strip | jsonify }},
        "category" : {{ post.tags | join: ", " | jsonify }},
        "url"      : {{ post.url | prepend: site.baseurl | jsonify }},
        "date"     : {{ post.date | date: "%B %e, %Y" | default: "January 1, 1970" | jsonify }}
      }
    {%- endfor -%}
    {%- for page in site.html_pages -%}
      {%- if page.title and page.title != "" and page.title != "{title}" and page.title != "404 - Page not found" -%}
        {%- unless first_entry -%},{%- endunless -%}
        {%- assign first_entry = false -%}
        {
          "title"    : {{ page.title | strip_html | strip | jsonify }},
          "category" : {%- if page.tags -%}{{ page.tags | join: ", " | jsonify }}{%- else -%}"page"{%- endif -%},
          "url"      : {{ page.url | prepend: site.baseurl | jsonify }},
          "date"     : {{ page.date | date: "%B %e, %Y" | default: "January 1, 1970" | jsonify }}
        }
      {%- endif -%}
    {%- endfor -%}
    ];

    SimpleJekyllSearch({
      searchInput:      document.getElementById('nav-search-input'),
      resultsContainer: document.getElementById('search-results-container'),
      json:             searchjson
    });
  </script>
</div>

{% endif %}
